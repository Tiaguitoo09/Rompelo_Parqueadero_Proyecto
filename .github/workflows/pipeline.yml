name: Verificar arquitectura

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verificar:
    name: 1. Verificar la arquitectura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Revisar que se respeten los ADR
        run: node tools/verificar.js
